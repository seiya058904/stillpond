name: Verify and deploy Pages

on:
  push:
    branches: [main]
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/readme-*'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - '**/readme-*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run verify
      - uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: dist

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:browser
        env:
          QA_SCREENSHOT_DIR: ${{ runner.temp }}/stillpond-browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: ${{ runner.temp }}/stillpond-browser
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, browser]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
